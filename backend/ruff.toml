line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "B", "I"]
# B008: FastAPI's Depends()/Query() defaults are idiomatic
ignore = ["E501", "B008"]

[lint.isort]
# The local alembic/ migrations folder shadows the package name
known-third-party = ["alembic"]
